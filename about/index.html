<!--
  ====================================================================
  STRUKTUR FILE HALAMAN INI
  ====================================================================
  index.html        -> markup saja (file ini)
  css/about.css      -> semua tampilan halaman About
  js/about-data.js   -> SATU-SATUNYA file yang perlu diedit untuk
                        mengubah foto, teks bio, atau daftar sosial media
  js/about.js        -> logic: render foto/teks/sosial, intro, kunang-kunang
  ====================================================================

<body>
<div id="bg-image"></div>

<!-- Intro — logo + ensō -->
<div id="introScreen">
  <img class="intro-enso" src="../img/enso.png" alt="">
  <img class="intro-logo" src="../img/logo.png" alt="Rinaldisign">
  <span class="intro-word">Rinaldisign</span>
</div>

<div class="bg-vignette"></div>
<div id="fireflies"></div>

<nav class="site-nav" id="siteNav">
  <a class="mark" href="../index.html">Rinaldisign</a>
  <div class="links">
    <a href="../works/index.html">Works</a>

    <a href="../index.html#listen">Listen</a>

  </div>
</nav>

<main>

  <section class="about-hero">
    <div class="section-inner about-inner">
      <div class="about-photo">
        <img id="aboutPhoto" src="" alt="">
      </div>
      <div class="about-copy">
        <span class="label">The Practice</span>
        <h1 id="aboutName"></h1>
        <div class="about-text" id="aboutText"></div>
      </div>
    </div>
  </section>

  <section class="about-social">
    <div class="section-inner">
      <div class="heading">
        <h2>Find Me Online</h2>
        <p class="sub">Every composition, every update — follow along on your platform of choice.</p>

      <div class="platform-grid" id="socialGrid"></div>
    </div>
  </section>

  <p>&copy; <span id="year"></span> Rinaldisign. All compositions original.</p>
  <div class="foot-links">
