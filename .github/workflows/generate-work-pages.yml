name: Generate work pages

# Jalan otomatis tiap kali works-data.js (atau template works/index.html)
# berubah di branch utama, plus bisa dipicu manual dari tab "Actions".
on:
  push:
    branches: [main]
    paths:
      - "works/js/works-data.js"
      - "works/index.html"
      - "scripts/generate-work-pages.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate per-work static pages
        run: node scripts/generate-work-pages.js

      - name: Commit generated pages (jika ada perubahan)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add works/dn*/index.html
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan halaman karya untuk di-commit."
          else
            git commit -m "chore: regenerate work pages [auto]"
            git push
          fi
